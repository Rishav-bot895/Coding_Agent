[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localdev"
version = "0.1.0"
description = "Native Windows single-file offline Python coding agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Personal Portfolio Project" }
]
keywords = ["windows", "coding-agent", "static-analysis", "slm", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.7.4,<3.0.0",
    "psutil>=5.9.8,<7.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.4.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "mypy>=1.10.0",
    "types-psutil",
    "build>=1.2.1",
    "wheel",
]

[project.scripts]
localdev = "localdev.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["localdev*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "windows: tests that require native Windows 11 x64 APIs (Job Objects, ReplaceFileW, etc.)",
    "integration: integration tests exercising multiple subsystems end-to-end",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = []

